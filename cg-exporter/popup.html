<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 420px; font: 13px/1.5 "Microsoft YaHei", sans-serif; margin: 0; padding: 10px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button { padding: 5px 12px; cursor: pointer; }
  select, input { padding: 3px 6px; }
  #status { font-size: 12px; color: #555; flex: 1; }
  #out { width: 100%; height: 220px; font-family: Consolas, monospace; font-size: 12px; }
  .warn { color: #b00; }
  .ok { color: #080; }
</style>
</head>
<body>
  <div class="row">
    <button id="scan">抓取题目</button>
    <select id="mode">
      <option value="auto">自动识别</option>
      <option value="text">题干文字优先</option>
      <option value="code">编程题容器优先</option>
    </select>
    <span id="status">就绪</span>
  </div>
  <div class="row">
    <button id="copy">复制</button>
    <button id="md">下载 .md</button>
    <button id="csv">下载 .csv</button>
  </div>
  <textarea id="out" placeholder="抓取结果将显示在这里"></textarea>

<script src="scrape.js"></script>
<script src="popup.js"></script>
</body>
</html>
